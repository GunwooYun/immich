# Fork-only CI. Deliberately a NEW file rather than extra jobs in test.yml:
#
#   1. Upstream's workflows cannot run here at all. Every job in test.yml starts with
#      `immich-app/devtools/actions/create-workflow-token` fed by the immich-app org's
#      PUSH_O_MATIC_* secrets, and each test job is `needs: pre-job`, whose first step is that
#      same token step — so on a fork pre-job fails and everything downstream is skipped.
#      web-lint additionally wants the `mich` self-hosted runner.
#   2. Merge surface. The fork has never authored a change under .github/ (every commit there is
#      upstream's), so a filename upstream will never have means git never sees a both-modified
#      path when we merge upstream.
#
# Triggers are push-only on feature branches. Every upstream workflow with a `push:` trigger pins
# it to `branches: [main]`, so pushing feat/** wakes none of them; adding `pull_request:` here
# would wake ~10 of them, all failing at the token step.
name: Fork — Google Drive

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
    paths-ignore:
      - 'dev-docs/**'
      - 'dev-test/google-drive/results/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The focused gate: the 11 spec files run.sh runs without --medium, plus the svelte-check
  # baseline gate. (The twelfth, the database spec, belongs to the medium job below.)
  # That gate is not a duplicate of upstream's `check:svelte` — it runs svelte-check WITHOUT
  # --no-tsconfig, so it type-checks the .ts/.spec.ts files (and the component call sites inside
  # them) that neither `tsc --noEmit` nor upstream's svelte pass reaches.
  feature:
    name: Feature suite (dev-test/google-drive)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Only node and pnpm. The root mise.toml pins seven more tools — java, ffmpeg, opentofu,
      # terragrunt, the openapi generators, and the extism-js/binaryen wasm chain — none of which
      # this job reaches, since it neither builds plugin-core nor regenerates the SDKs.
      - name: Setup mise (node + pnpm)
        uses: jdx/mise-action@v3
        with:
          install_args: node pnpm

      # run.sh assumes an installed workspace — it calls `npx vitest` / `npx svelte-check`
      # directly. Installing here rather than in run.sh keeps the local loop fast.
      # Both packages are built because both of their outputs are gitignored, so a clean checkout
      # has neither, and each is needed at *runtime* by something this job runs:
      #   @immich/plugin-sdk — server/src/enum.ts imports WorkflowTrigger from it as a value
      #     (z.enum), and its entry point is dist/index.js.
      #   @immich/sdk — the web specs import it (without packages/sdk/build, vitest fails with
      #     `Failed to resolve import "@immich/sdk"`), and plugin-sdk's own build bundles it:
      #     src/host-functions.ts:7 imports values from it and esbuild.js runs with bundle: true.
      #     The server specs do *not* need it, because that bundling inlines it.
      #
      # One multi-filter invocation rather than four ordered ones: pnpm builds a filtered set in
      # dependency order, so the order they are listed in cannot be got wrong. That matters here —
      # a previous round of this file built plugin-sdk first and failed on a clean runner with
      # `Could not resolve "@immich/sdk"`, while passing locally because an earlier build had left
      # packages/sdk/build behind. mise.toml's own //:plugins task uses this same idiom.
      #
      # Not //:plugins itself: that one also builds plugin-core, whose build:wasm needs the
      # extism-js and binaryen toolchain this job deliberately does not install.
      #
      # Caveat, latent: pnpm-workspace.yaml sets injectWorkspacePackages: true. Today the
      # workspace links are plain symlinks, so building after both installs is equivalent to
      # interleaving them. If a future pnpm actually honours injection, a consumer installed
      # before its dependency is built could copy an empty output, and this would need to go
      # back to install-then-build per package — in dependency order.
      - name: Install workspaces
        run: |
          pnpm --filter @immich/sdk --filter @immich/plugin-sdk install --frozen-lockfile
          pnpm --filter @immich/sdk --filter @immich/plugin-sdk build
          pnpm --filter immich install --frozen-lockfile
          pnpm --filter immich-web install --frozen-lockfile

      # The 19 committed evidence files are cleared first, so whatever remains afterwards is
      # this run's. Picking the newest instead does not work, and the last attempt made it
      # worse: run.sh stamps filenames with `date +%Y%m%d-%H%M` in local time, the committed
      # ones were written in KST (+09:00) and a runner is UTC — so a run at 03:24Z writes
      # 20260902-0324.txt, which sorts *before* every committed file, and `sort | tail -1`
      # would render a stale PASS with deterministic reliability. Clearing sidesteps the whole
      # question, and fixes the artifact upload below at the same time.
      - name: Run the feature suite
        run: |
          rm -f dev-test/google-drive/results/*.txt
          bash dev-test/google-drive/run.sh

      # The evidence file is uploaded, never committed: dev-test/google-drive/results/ is tracked
      # on purpose so a review report can cite a run at a known commit (CLAUDE.md §2). Machine runs
      # would drown that, and a committing job needs write permissions and invites push loops.
      - name: Summarise the run
        if: always()
        run: |
          # Only one file can be here — the run step cleared the rest.
          latest="$(ls dev-test/google-drive/results/*.txt 2>/dev/null | head -1)"
          if [ -n "$latest" ]; then
            {
              echo "### $latest"
              echo '```'
              tail -40 "$latest"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: google-drive-evidence
          path: dev-test/google-drive/results/
          retention-days: 30

  # The broad sweep. run.sh covers 11 spec files and no lint/format/tsc, so this is the job that
  # actually catches what an upstream merge breaks. Starts non-blocking: the fork has never run
  # these in CI, and both ci-unit tasks run `prettier --check .` (rooted at web/ and server/
  # respectively) before they reach a test — first of all for web, and after :install and
  # //:plugins for server (server/mise.toml:58-66). Either way a formatting slip stops the sweep
  # before a single test runs, which is what it did the first time it was checked, on three
  # files this fork wrote.
  regression:
    name: Full server + web unit sweep
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v3

      # Blocking as of runs 33715025550 and 33758496224, both green. They started non-blocking
      # because neither had ever executed on this fork; the summary below is kept anyway, since a
      # named outcome per step is cheaper to read than opening the log.
      - name: server — format, lint, check, unit tests
        id: server
        run: mise run //server:ci-unit

      - name: web — format, check, unit tests
        id: web
        run: mise run //web:ci-unit

      - name: Report outcomes
        if: always()
        run: |
          {
            echo "### Regression sweep (non-blocking)"
            echo "- server //server:ci-unit: ${{ steps.server.outcome }}"
            echo "- web //web:ci-unit: ${{ steps.web.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.server.outcome }}" = "failure" ] || [ "${{ steps.web.outcome }}" = "failure" ]; then
            echo "::warning::the regression sweep failed; it is non-blocking for now"
          fi

  # Real-Postgres tests. No `services:` block: server/test/medium/globalSetup.ts starts the
  # database itself through testcontainers (ghcr.io/immich-app/postgres:14-vectorchord0.4.3) and
  # overwrites IMMICH_TEST_POSTGRES_URL with the container's URL, so nothing needs configuring.
  medium:
    name: Medium (real database) tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # submodules: the medium suite is wider than run.sh --medium — it runs every spec under
      # server/test/medium, and several of those read fixtures from e2e/test-assets, which is a
      # submodule (medium.factory.ts resolves testAssetsDir into it). Upstream's own medium job
      # checks out recursively for the same reason.
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Setup mise
        uses: jdx/mise-action@v3

      # Blocking now, for the same reason as the sweep: two green runs. The feature's own database
      # spec lives inside this 56-spec suite, so a red here was never something to shrug at.
      - name: server — medium tests
        id: medium
        run: mise run //server:ci-medium

      - name: Report outcome
        if: always()
        run: |
          echo "### Medium suite (non-blocking): ${{ steps.medium.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.medium.outcome }}" = "failure" ]; then
            echo "::warning::the medium suite failed; it is non-blocking for now"
          fi

  # The generated reference SQL is only correct if the generator ran against a database that has the
  # migrations applied. Against one that does not, multi-statement methods are silently truncated
  # and `git diff` comes out empty — which is exactly how a stale file was reported twice as "no
  # drift". This job is here so that mistake cannot be made quietly again.
  sql:
    name: Generated SQL is current
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/immich
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v3

      # Same install block as the feature job, and for the same reason: nest build resolves through
      # node_modules, and @immich/sdk's output is needed before plugin-sdk can be bundled. The
      # first version of this job went straight to the build and died with exit 127.
      - name: Install workspaces
        run: |
          pnpm --filter @immich/sdk --filter @immich/plugin-sdk install --frozen-lockfile
          pnpm --filter @immich/sdk --filter @immich/plugin-sdk build
          pnpm --filter immich install --frozen-lockfile

      - name: Build the server
        run: mise run //server:build

      # Not a `services:` container. immich's schema needs the vchord extension preloaded, which
      # means `-c shared_preload_libraries=vchord.so` on the postgres command line — and a service
      # container takes `options`, `env` and `ports` but no command override. The first version of
      # this job used `services:` and died in "Apply migrations" because the extension could not be
      # created. Starting it by hand is the same thing the medium suite's globalSetup.ts does
      # through testcontainers, with the same image and the same flags.
      - name: Start Postgres
        run: |
          docker run -d --name immich-postgres \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres -e POSTGRES_DB=immich \
            -p 5432:5432 \
            ghcr.io/immich-app/postgres:14-vectorchord0.4.3 \
            postgres \
              -c shared_preload_libraries=vchord.so \
              -c config_file=/var/lib/postgresql/data/postgresql.conf
          # -h 127.0.0.1, not the default unix socket. The image's entrypoint runs initdb against a
          # temporary server started with listen_addresses='' — reachable on the socket, invisible
          # over TCP — so a socket probe reports READY while the next step, which connects to
          # localhost:5432, would still get ECONNREFUSED. Asking over the same transport the
          # migrations use is the whole check. (globalSetup.ts solves this by waiting for the
          # "ready to accept connections" line to appear twice; same idea, fewer moving parts.)
          for _ in $(seq 1 60); do
            if docker exec immich-postgres pg_isready -h 127.0.0.1 -U postgres -d immich >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready"
          docker logs immich-postgres
          exit 1

      # Not `mise //server:migrations`: that task still shells out to dist/bin/migrations.js, which
      # upstream no longer builds — the migration CLI is `sql-tools` from the server workspace now.
      # The task's staleness is upstream's to fix; this job just calls the real entry point.
      - name: Apply migrations
        run: pnpm --filter immich run migrations:run

      # The job's last unchecked assumption. A generator run against a database whose migrations
      # silently did nothing produces truncated SQL — and if the committed files were generated the
      # same way, the diff comes out empty and the job reports "no drift" having compared two
      # wrong things. Asking for a table that only exists after this fork's migrations closes it.
      - name: Check the migrations actually landed
        run: |
          # Names, not counts. Two earlier versions of this check were weaker: asking for
          # `google_drive_upload` answered yes for a database stuck several migrations back (the
          # table has existed since this feature's first migration), and counting rows fails on a
          # long-lived database for reasons that are not drift — upstream has deleted a migration
          # and renamed several, so applied and on-disk counts can differ while the database is in
          # fact current. Comparing the name sets says *which* migration is missing, and says
          # nothing when the two agree.
          ls server/src/schema/migrations/*.ts | xargs -n1 basename | sed 's/\.ts$//' | sort > /tmp/on-disk.txt
          docker exec immich-postgres psql -U postgres -d immich -tAc 'select name from kysely_migrations' | sort > /tmp/applied.txt
          if ! diff -u /tmp/on-disk.txt /tmp/applied.txt; then
            echo "::error::the applied migrations do not match the files on disk; the generated SQL would be truncated"
            exit 1
          fi
          echo "all $(wc -l < /tmp/on-disk.txt) migrations applied"

      - name: Regenerate
        run: mise run //:sql

      # `git status --porcelain`, not `git diff --exit-code`: diff is blind to untracked files, so a
      # newly added repository — whose generated .sql file does not exist in the tree yet — would
      # let this job pass having compared nothing at all. That is the exact failure mode the job
      # exists to prevent, one level up.
      - name: Fail if the committed SQL is out of date
        run: |
          if [ -n "$(git status --porcelain -- server/src/queries)" ]; then
            git status --porcelain -- server/src/queries
            git diff -- server/src/queries
            echo "::error::server/src/queries is out of date — run \`mise //:sql\` against a migrated database and commit the result"
            exit 1
          fi
